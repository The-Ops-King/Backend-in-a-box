# Interim scheduler while the Vercel team is on Hobby (daily crons only). Every 5 minutes.
# On Vercel Pro set platform/vercel.json to "* * * * *" and this becomes the backup scheduler.
# Needs two repo secrets: TICK_URL (e.g. https://backend-in-a-box.vercel.app) and CRON_SECRET (same value as the Vercel env var).
name: tick
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency: { group: tick, cancel-in-progress: false }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: hit /api/tick
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$CRON_SECRET" ]; then echo "TICK_URL / CRON_SECRET not set — skipping"; exit 0; fi
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$TICK_URL/api/tick")
          cat /tmp/out.json; echo
          [ "$code" = "200" ] || { echo "tick returned $code"; exit 1; }
